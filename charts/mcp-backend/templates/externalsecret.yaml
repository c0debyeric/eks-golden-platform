{{- /*
Project the RDS master credentials from AWS Secrets Manager into this namespace.

NO SECRET VALUES LIVE HERE — this is a pointer. External Secrets Operator reads
`eks-golden/rds-master` using the ESO service account's EKS Pod Identity
credentials and writes the Kubernetes Secret the Deployment consumes. That is why
this repo can be public.

apiVersion MUST be external-secrets.io/v1, NOT v1beta1: ESO stopped serving
v1beta1 on 2026-05-01, so on the pinned 2.8.0 chart a v1beta1 manifest fails to
apply with Argo CD's opaque "one or more synchronization tasks are not valid".

The Secrets Manager entry is the standard RDS JSON shape — username, password,
engine, port, dbname, host — so each property maps 1:1 to a key here.
*/ -}}
{{- if .Values.database.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mcp-backend.fullname" . }}-db
  labels:
    {{- include "mcp-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.database.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.database.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: {{ .Values.database.secretsManagerKey }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.database.secretsManagerKey }}
        property: port
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.database.secretsManagerKey }}
        property: dbname
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.secretsManagerKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretsManagerKey }}
        property: password
{{- end }}
