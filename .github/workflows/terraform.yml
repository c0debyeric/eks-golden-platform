# CI for the EKS golden platform. Auth to AWS is via GitHub OIDC — NO stored AWS keys.
#
# Job split reflects the trust scope (role assumable only from ref:refs/heads/main):
#   - lint (any push/PR): fmt + validate. Needs NO AWS creds, so it works on PRs too.
#   - plan (push to main): assumes the AWS role via OIDC and runs `terraform plan`.
name: terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for OIDC: the job must be allowed to mint an OIDC token.
# `contents: read` is least-privilege for checkout.
permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.8" # latest stable; satisfies use_lockfile (>= 1.11) + provider majors
  AWS_REGION: us-east-1

jobs:
  # Syntax + formatting. No cloud access — safe to run on untrusted PRs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: terraform validate
        # -backend=false: validate syntax + provider schema without touching remote state.
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  # GitOps chart/manifest contract check. No cloud access — runs on PRs like lint.
  #
  # WHY this job exists: the highest-frequency ArgoCD failure in this repo's history is a
  # committed CR whose apiVersion the pinned chart no longer serves. It surfaces only as
  # "one or more synchronization tasks are not valid" — naming neither the resource nor the
  # version — and it is invisible to terraform fmt/validate. Renovate will now open chart-bump
  # PRs automatically, so this gate is what stops a well-meaning bump from silently breaking
  # the secrets pipeline at sync time instead of at review time.
  gitops-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # Render each pinned chart, then assert every committed CR's apiVersion is SERVED by it.
      # Chart versions are read from the Application manifests so this can't drift from them.
      - name: External Secrets — CR apiVersions are served by the pinned chart
        run: |
          set -euo pipefail
          ESO_VER=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' \
            gitops/bootstrap/external-secrets.yaml | head -1)
          echo "Pinned external-secrets chart: ${ESO_VER}"
          helm repo add eso https://charts.external-secrets.io >/dev/null
          helm repo update >/dev/null
          helm template eso eso/external-secrets --version "${ESO_VER}" \
            -n external-secrets -f gitops/apps/external-secrets/values.yaml > /tmp/eso.yaml
          python3 scripts/crd_apiversion_gate.py /tmp/eso.yaml \
            gitops/apps/external-secrets/clustersecretstore.yaml

      # Karpenter ships CRDs in crds/ (NOT templates/), so `helm template` renders zero CRDs and
      # would produce a false PASS. The chart must be pulled and untarred to inspect them.
      - name: Karpenter — CR apiVersions are served by the pinned chart
        run: |
          set -euo pipefail
          KARP_VER=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' \
            gitops/bootstrap/karpenter.yaml | head -1)
          echo "Pinned karpenter chart: ${KARP_VER}"
          rm -rf /tmp/karp && mkdir -p /tmp/karp
          helm pull oci://public.ecr.aws/karpenter/karpenter \
            --version "${KARP_VER}" --untar --untardir /tmp/karp
          cat /tmp/karp/karpenter/crds/*.yaml > /tmp/karp_crds.yaml
          python3 scripts/crd_apiversion_gate.py /tmp/karp_crds.yaml \
            gitops/apps/karpenter/nodepool.yaml \
            gitops/apps/karpenter/ec2nodeclass.yaml

      # apiVersion alone is NOT enough. On 2026-07-29 the apiVersion gate passed
      # (NodePool karpenter.sh/v1 is served) while Karpenter rejected every NodeClaim it computed:
      #   spec.requirements[6].operator: Unsupported value: "Gte"
      # Karpenter 1.14 ADDED the Gte/Lte operators, but the cluster still had CRDs from the 1.0.8
      # chart, because `helm upgrade` does NOT touch crds/. Net effect: zero capacity could be
      # provisioned, ArgoCD + cert-manager + ESO went Pending, and the argo-cd upgrade failed.
      # This step validates committed field VALUES against the pinned chart's CRD schema (enum
      # constraints), so an operator/policy value that a bump adds or removes fails in review.
      - name: Karpenter — CR field values satisfy the pinned chart's CRD schema
        run: |
          set -euo pipefail
          python3 scripts/crd_schema_gate.py /tmp/karp_crds.yaml \
            gitops/apps/karpenter/nodepool.yaml \
            gitops/apps/karpenter/ec2nodeclass.yaml

      # A NodePool with no memory floor lets Karpenter pick a 2GiB *.medium while VPC CNI prefix
      # delegation advertises 40 allocatable pods on it. The scheduler then packs ~16 pods onto
      # ~1GiB, the node OOMs hard enough to kill its own kubelet, and every pod on it hangs
      # Terminating forever because nothing is left to reap them. That is precisely the
      # 2026-07-29 c9g.medium failure. Assert the floor exists so it can't silently regress.
      - name: Karpenter — NodePool declares a memory floor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          pool = yaml.safe_load(open("gitops/apps/karpenter/nodepool.yaml"))
          reqs = pool["spec"]["template"]["spec"]["requirements"]
          mem = [r for r in reqs if r["key"] == "karpenter.k8s.aws/instance-memory"]
          if not mem:
              sys.exit(
                  "FAIL: NodePool has no karpenter.k8s.aws/instance-memory requirement.\n"
                  "Without a floor Karpenter may select a ~2GiB node that OOM-kills its kubelet."
              )
          floor = min(int(v) for r in mem for v in r["values"])
          if floor < 4095:
              sys.exit(f"FAIL: instance-memory floor {floor}MiB is below the 4095MiB minimum.")
          print(f"PASS: NodePool memory floor = {floor}MiB (>= 4095)")
          PY

      # Multi-env Helm values: dev/stage/prod are three NAMESPACES on the one
      # cluster, all rendered from a single shared chart. Several mistakes are silent
      # there because each produces a VALID render that Argo CD reports as Synced:
      #   - a committed placeholder tag, which is exactly how prod-bootstrap reached
      #     prod's manifest and left the Deployment unable to pull anything
      #   - a missing digest, which breaks the "prod runs the bytes stage validated"
      #     guarantee the promotion pipeline exists to provide
      #   - two envs declaring the same `environment` tag, which merges their telemetry
      #   - a PDB with minAvailable >= replicaCount, which deadlocks node drains
      # Gate asserts all four, per app, and that no chart sentinel survives rendering.
      - name: Per-env Helm values are pinned, unique and placeholder-free
        run: |
          set -euo pipefail
          python3 scripts/helm_values_gate.py charts/mcp-backend  gitops/apps/mcp-backend
          python3 scripts/helm_values_gate.py charts/mcp-frontend gitops/apps/mcp-frontend

      # `helm lint` on top of the values gate: the gate proves the environment files are
      # sane, lint proves the CHART is well-formed independently of them.
      - name: helm lint the application charts
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            helm lint "$chart" --values "$chart/values.yaml" --quiet \
              || { echo "::error::helm lint failed for $chart"; exit 1; }
          done

      # The NodePool allows arch In [amd64, arm64] for cheaper Graviton capacity and the
      # Deployment sets no nodeSelector, so a pod can land on either. An amd64-only image
      # on an arm64 node PULLS FINE and then dies with "exec format error" — which reads
      # like a broken entrypoint, not an arch mismatch, and only reproduces when the
      # scheduler happens to pick ARM. Hit live on an m9gd.medium node 2026-07-29. The two
      # halves of this contract live in different files, so nothing links them but this.
      - name: Build platforms cover every arch the NodePool can provision
        run: |
          set -euo pipefail
          python3 scripts/build_arch_gate.py \
            .github/workflows/build-image.yml \
            gitops/apps/karpenter/nodepool.yaml

      # Catches invalidated values keys after a bump (a chart with values.schema.json rejects
      # unknown keys outright, which leaves the ArgoCD app stuck "Unknown" — it can't even render).
      #
      # NOTE this step is deliberately STRICT and therefore requires the audit's chart bumps to be
      # merged. Verified locally: opentelemetry-operator 0.90.4 ships a values.schema.json that is
      # itself malformed (featureGates.examples declared a string where JSON Schema 2019-09 wants
      # an array), which modern Helm rejects outright — so the OLD pin cannot render at all, while
      # 0.120.0 renders clean. Loosening the gate to accommodate a broken chart would defeat it.
      - name: All charts render against committed values
        run: |
          set -euo pipefail
          helm repo add grafana-community https://grafana-community.github.io/helm-charts >/dev/null
          helm repo add prom https://prometheus-community.github.io/helm-charts >/dev/null
          helm repo add otel https://open-telemetry.github.io/opentelemetry-helm-charts >/dev/null
          helm repo add eks-charts https://aws.github.io/eks-charts >/dev/null
          helm repo update >/dev/null
          render() {  # chart_ref, manifest_with_pin, namespace, values_file
            ver=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "$2" | head -1)
            echo "==> $1 @ ${ver}"
            helm template t "$1" --version "${ver}" -n "$3" -f "$4" >/dev/null
          }
          render grafana-community/loki gitops/bootstrap/loki.yaml logging \
            gitops/apps/loki/values.yaml
          render grafana-community/tempo gitops/bootstrap/tempo.yaml tracing \
            gitops/apps/tempo/values.yaml
          render prom/kube-prometheus-stack gitops/bootstrap/kube-prometheus-stack.yaml monitoring \
            gitops/apps/kube-prometheus-stack/values.yaml
          render otel/opentelemetry-operator gitops/bootstrap/otel-operator.yaml observability \
            gitops/apps/otel-operator/values.yaml
          render eks-charts/aws-load-balancer-controller gitops/bootstrap/alb-controller.yaml \
            kube-system gitops/apps/alb-controller/values.yaml

      # The two CRD gates above cannot see this class of bug. The OpenTelemetryCollector CRD
      # declares spec.config with x-kubernetes-preserve-unknown-fields, so Kubernetes deliberately
      # does not validate the pipeline inside it — that schema belongs to the collector binary.
      #
      # Concretely: `prometheusremotewrite` takes `remote_write_queue`, NOT the `sending_queue`
      # every other exporter accepts. Writing sending_queue passes kubectl, helm template, both
      # CRD gates and ArgoCD (Application goes green), then CrashLoops the collector with
      # "has invalid keys: sending_queue". Since this collector is the ONLY path to Prometheus,
      # Loki and Tempo, that means the whole platform goes blind while every dashboard and every
      # ArgoCD tile reports healthy. So: run the real binary, from the exact image the pinned
      # operator chart deploys, in validate mode.
      - name: OTel Collector pipelines are valid for the pinned collector build
        run: |
          set -euo pipefail
          ver=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' \
            gitops/bootstrap/otel-operator.yaml | head -1)
          image=$(helm template t otel/opentelemetry-operator --version "${ver}" \
            -n observability -f gitops/apps/otel-operator/values.yaml \
            | grep -oE 'otel/opentelemetry-collector-contrib:[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          python3 scripts/otel_config_gate.py "${image}" \
            gitops/apps/otel-collector/collector.yaml \
            gitops/apps/otel-collector/logs-daemonset.yaml

  # Plan against the real account. Only on main, where the OIDC role trust allows it.
  plan:
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exchanges the GitHub OIDC token for short-lived AWS creds. No secrets stored.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # repo variable, set from bootstrap output
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Backend config passed inline (bucket name + region are NOT secret). use_lockfile is in
      # the versions.tf backend block. Set the TF_STATE_BUCKET repo variable to your state bucket.
      - name: terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks-golden-platform/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        # Plan scope: the AWS INFRASTRUCTURE layer only (VPC, EKS, Karpenter, IAM, RDS,
        # storage). We deliberately -target these modules/resources and EXCLUDE the in-cluster
        # resources (helm_release.argocd, kubectl_manifest.root_app) for two reasons:
        #   1. Those are GitOps-managed — ArgoCD reconciles cluster state from Git, so Terraform
        #      planning them in CI adds no review value.
        #   2. The CI OIDC role can auth to the K8s API but AmazonEKSViewPolicy can't read
        #      ArgoCD CRDs (applications.argoproj.io), so refreshing them fails; and CI lacks the
        #      gitignored tfvars, so a full plan shows a spurious RDS teardown.
        # -lock=false: a read-only plan must not acquire the S3 state lock (else it races/blocks
        # any concurrent `terraform apply` with a 412 PreconditionFailed).
        #
        # -var ci_role_arn: WITHOUT this, CI plans with the variable at its "" default, so
        # `access_entries` evaluates to {} and every plan reports a FALSE teardown of the CI
        # access entry ("key [ci] is not in for_each map") plus its policy association. A plan
        # that cries wolf on every PR trains reviewers to ignore it, which defeats the job.
        # Passing the same ARN the job just assumed makes the plan honest.
        run: |
          terraform -chdir=terraform plan -input=false -no-color -lock=false \
            -var="ci_role_arn=${{ vars.AWS_ROLE_ARN }}" \
            -target=module.vpc \
            -target=module.eks \
            -target=module.karpenter \
            -target=aws_vpc_endpoint.s3 \
            -target=aws_iam_role.external_secrets \
            -target=aws_iam_role.alb_controller \
            -target=aws_iam_role.ebs_csi \
            -target=aws_iam_role.loki \
            -target=aws_s3_bucket.loki \
            -target=aws_iam_role.tempo \
            -target=aws_s3_bucket.tempo

