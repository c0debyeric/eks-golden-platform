# CI for the EKS golden platform. Auth to AWS is via GitHub OIDC — NO stored AWS keys.
#
# Job split reflects the trust scope (role assumable only from ref:refs/heads/main):
#   - lint (any push/PR): fmt + validate. Needs NO AWS creds, so it works on PRs too.
#   - plan (push to main): assumes the AWS role via OIDC and runs `terraform plan`.
name: terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for OIDC: the job must be allowed to mint an OIDC token.
# `contents: read` is least-privilege for checkout.
permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.8" # latest stable; satisfies use_lockfile (>= 1.11) + provider majors
  AWS_REGION: us-east-1

jobs:
  # Syntax + formatting. No cloud access — safe to run on untrusted PRs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: terraform validate
        # -backend=false: validate syntax + provider schema without touching remote state.
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  # GitOps chart/manifest contract check. No cloud access — runs on PRs like lint.
  #
  # WHY this job exists: the highest-frequency ArgoCD failure in this repo's history is a
  # committed CR whose apiVersion the pinned chart no longer serves. It surfaces only as
  # "one or more synchronization tasks are not valid" — naming neither the resource nor the
  # version — and it is invisible to terraform fmt/validate. Renovate will now open chart-bump
  # PRs automatically, so this gate is what stops a well-meaning bump from silently breaking
  # the secrets pipeline at sync time instead of at review time.
  gitops-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # Render each pinned chart, then assert every committed CR's apiVersion is SERVED by it.
      # Chart versions are read from the Application manifests so this can't drift from them.
      - name: External Secrets — CR apiVersions are served by the pinned chart
        run: |
          set -euo pipefail
          ESO_VER=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' \
            gitops/bootstrap/external-secrets.yaml | head -1)
          echo "Pinned external-secrets chart: ${ESO_VER}"
          helm repo add eso https://charts.external-secrets.io >/dev/null
          helm repo update >/dev/null
          helm template eso eso/external-secrets --version "${ESO_VER}" \
            -n external-secrets -f gitops/apps/external-secrets/values.yaml > /tmp/eso.yaml
          python3 scripts/crd_apiversion_gate.py /tmp/eso.yaml \
            gitops/apps/external-secrets/clustersecretstore.yaml

      # Karpenter ships CRDs in crds/ (NOT templates/), so `helm template` renders zero CRDs and
      # would produce a false PASS. The chart must be pulled and untarred to inspect them.
      - name: Karpenter — CR apiVersions are served by the pinned chart
        run: |
          set -euo pipefail
          KARP_VER=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' \
            gitops/bootstrap/karpenter.yaml | head -1)
          echo "Pinned karpenter chart: ${KARP_VER}"
          rm -rf /tmp/karp && mkdir -p /tmp/karp
          helm pull oci://public.ecr.aws/karpenter/karpenter \
            --version "${KARP_VER}" --untar --untardir /tmp/karp
          cat /tmp/karp/karpenter/crds/*.yaml > /tmp/karp_crds.yaml
          python3 scripts/crd_apiversion_gate.py /tmp/karp_crds.yaml \
            gitops/apps/karpenter/nodepool.yaml \
            gitops/apps/karpenter/ec2nodeclass.yaml

      # Catches invalidated values keys after a bump (a chart with values.schema.json rejects
      # unknown keys outright, which leaves the ArgoCD app stuck "Unknown" — it can't even render).
      #
      # NOTE this step is deliberately STRICT and therefore requires the audit's chart bumps to be
      # merged. Verified locally: opentelemetry-operator 0.90.4 ships a values.schema.json that is
      # itself malformed (featureGates.examples declared a string where JSON Schema 2019-09 wants
      # an array), which modern Helm rejects outright — so the OLD pin cannot render at all, while
      # 0.120.0 renders clean. Loosening the gate to accommodate a broken chart would defeat it.
      - name: All charts render against committed values
        run: |
          set -euo pipefail
          helm repo add grafana-community https://grafana-community.github.io/helm-charts >/dev/null
          helm repo add prom https://prometheus-community.github.io/helm-charts >/dev/null
          helm repo add otel https://open-telemetry.github.io/opentelemetry-helm-charts >/dev/null
          helm repo add eks-charts https://aws.github.io/eks-charts >/dev/null
          helm repo update >/dev/null
          render() {  # chart_ref, manifest_with_pin, namespace, values_file
            ver=$(grep -oP 'targetRevision:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "$2" | head -1)
            echo "==> $1 @ ${ver}"
            helm template t "$1" --version "${ver}" -n "$3" -f "$4" >/dev/null
          }
          render grafana-community/loki gitops/bootstrap/loki.yaml logging \
            gitops/apps/loki/values.yaml
          render grafana-community/tempo gitops/bootstrap/tempo.yaml tracing \
            gitops/apps/tempo/values.yaml
          render prom/kube-prometheus-stack gitops/bootstrap/kube-prometheus-stack.yaml monitoring \
            gitops/apps/kube-prometheus-stack/values.yaml
          render otel/opentelemetry-operator gitops/bootstrap/otel-operator.yaml observability \
            gitops/apps/otel-operator/values.yaml
          render eks-charts/aws-load-balancer-controller gitops/bootstrap/alb-controller.yaml \
            kube-system gitops/apps/alb-controller/values.yaml

  # Plan against the real account. Only on main, where the OIDC role trust allows it.
  plan:
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exchanges the GitHub OIDC token for short-lived AWS creds. No secrets stored.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # repo variable, set from bootstrap output
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Backend config passed inline (bucket name + region are NOT secret). use_lockfile is in
      # the versions.tf backend block. Set the TF_STATE_BUCKET repo variable to your state bucket.
      - name: terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks-golden-platform/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        # Plan scope: the AWS INFRASTRUCTURE layer only (VPC, EKS, Karpenter, IAM, RDS,
        # storage). We deliberately -target these modules/resources and EXCLUDE the in-cluster
        # resources (helm_release.argocd, kubectl_manifest.root_app) for two reasons:
        #   1. Those are GitOps-managed — ArgoCD reconciles cluster state from Git, so Terraform
        #      planning them in CI adds no review value.
        #   2. The CI OIDC role can auth to the K8s API but AmazonEKSViewPolicy can't read
        #      ArgoCD CRDs (applications.argoproj.io), so refreshing them fails; and CI lacks the
        #      gitignored tfvars, so a full plan shows a spurious RDS teardown.
        # -lock=false: a read-only plan must not acquire the S3 state lock (else it races/blocks
        # any concurrent `terraform apply` with a 412 PreconditionFailed).
        run: |
          terraform -chdir=terraform plan -input=false -no-color -lock=false \
            -target=module.vpc \
            -target=module.eks \
            -target=module.karpenter \
            -target=aws_vpc_endpoint.s3 \
            -target=aws_iam_role.external_secrets \
            -target=aws_iam_role.alb_controller \
            -target=aws_iam_role.ebs_csi \
            -target=aws_iam_role.loki \
            -target=aws_s3_bucket.loki \
            -target=aws_iam_role.tempo \
            -target=aws_s3_bucket.tempo

