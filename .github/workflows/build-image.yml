# Build & push the mcp-backend container image to Amazon ECR.
#
# Keyless, same model as terraform.yml: the job mints a GitHub OIDC token and
# exchanges it for short-lived AWS creds by assuming the repo's CI role
# (vars.AWS_ROLE_ARN). No static registry credentials are stored.
#
# The OIDC role trust is scoped to ref:refs/heads/main, so this only runs on
# main (and manual dispatch from main). Images are tagged by immutable git SHA.
name: build-image

on:
  push:
    branches: [main]
    paths:
      - "application/backend/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

# Serialise runs per commit. WHY: the tag is the 12-char git SHA and ECR tags are
# IMMUTABLE, so two concurrent runs for the same commit (e.g. a push plus a manual
# workflow_dispatch, which is exactly what happened on 2026-07-29) both pass the
# "does this tag exist yet" check, both build, and the loser dies with:
#   failed to push ...: The image tag 'a7b96ed603df' already exists ... and cannot be
#   overwritten because the tag is immutable
# That reads like a workflow bug but is really a race. cancel-in-progress is deliberately
# FALSE: the in-flight run may already have pushed, and cancelling it mid-push would leave
# a partially-exported manifest. Queueing lets the second run reach the existence check
# and skip cleanly instead.
concurrency:
  group: build-image-${{ github.sha }}
  cancel-in-progress: false

# Required for OIDC (id-token), checkout (contents), and the automated dev-pin PR.
# contents: write + pull-requests: write are needed by create-pull-request to push the
# deploy/dev-* branch and open the PR. Still no packages: write -- the image goes to ECR
# via OIDC, not to GHCR.
permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mcp-backend

jobs:
  build-push:
    # OIDC trust only allows main; guard manual dispatch on other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # repo variable, from bootstrap output
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-image-${{ github.run_id }}

      # Idempotent: create the repo on first run (IMMUTABLE tags + scan-on-push).
      # Prefer moving this to terraform/bootstrap if you want it fully IaC-managed.
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag-mutability IMMUTABLE \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256 >/dev/null
          echo "ECR repository ready: $ECR_REPOSITORY"

      # Tags are IMMUTABLE, so a re-run on the same commit would fail the push.
      # Detect an existing tag and skip the build instead (idempotent re-runs).
      - name: Check if image tag already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${GITHUB_SHA::12}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_SHA::12} already exists — skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU provides the arm64 emulation buildx needs to cross-compile on an amd64 runner.
      # Without it the linux/arm64 leg fails outright ("exec format error" during build).
      - name: Set up QEMU
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Compute image reference
        id: meta
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          echo "tag=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: application/backend
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          # MULTI-ARCH is mandatory here, not an optimisation.
          #
          # The Karpenter NodePool deliberately allows kubernetes.io/arch In [amd64, arm64]
          # to pick up cheaper Graviton capacity, and this Deployment sets no nodeSelector,
          # so a pod can legitimately land on either. An amd64-only image scheduled onto an
          # arm64 node does NOT fail to pull -- it pulls fine and then dies at exec with:
          #   exec /usr/local/bin/docker-entrypoint.sh: exec format error
          # which reads like a broken entrypoint rather than an architecture mismatch, and
          # only reproduces when the scheduler happens to choose ARM. Observed live on an
          # m9gd.medium node 2026-07-29.
          #
          # Building both arches keeps the Graviton cost saving AND makes placement a
          # non-issue. The alternative -- pinning the Deployment to amd64 -- would forfeit
          # the cheaper capacity the NodePool was configured to use.
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Seed the DEV overlay with what was just built. This is the write-back step whose
      # absence was the real defect: previously the workflow pushed an image and then asked
      # a HUMAN to hand-edit deployment.yaml, so nothing consumed the build and the
      # committed placeholder (REPLACE_WITH_GIT_SHA) stayed live -- leaving mcp-backend
      # Degraded on InvalidImageName indefinitely.
      #
      # WHY only dev, never stage/prod: a push to main must not be able to change
      # production. Moving further along the chain is the promote.yml workflow's job, which
      # requires an explicit dispatch and opens a reviewable PR. Build auto-delivers to dev
      # and stops there.
      #
      # WHY a PR rather than a direct push to main: a direct push from a workflow either
      # needs branch-protection bypass or silently fails on a protected main. A PR is also
      # the audit record of which build produced which dev deploy.
      - name: Pin dev overlay to the new image
        if: steps.exists.outputs.found == 'false'
        run: |
          set -euo pipefail
          DST=gitops/apps/mcp-backend/overlays/dev/kustomization.yaml
          # `digest` (not `newDigest` -- kustomize rejects that field) is authoritative;
          # newTag is kept alongside it for human readability in the rendered image ref.
          TAG="${GITHUB_SHA::12}" \
          DIGEST='${{ steps.build.outputs.digest }}' \
          yq -i '(.images[] | select(.name == "PLACEHOLDER_IMAGE"))
                   |= (.newTag = strenv(TAG) | .digest = strenv(DIGEST))' "$DST"
          kubectl kustomize gitops/apps/mcp-backend/overlays/dev >/dev/null
          python3 scripts/kustomize_overlay_gate.py gitops/apps/mcp-backend

      - name: Open dev pin pull request
        if: steps.exists.outputs.found == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: deploy/dev-${{ github.sha }}
          delete-branch: true
          title: "deploy(dev): ${{ github.sha }}"
          commit-message: |
            deploy(dev): pin mcp-backend to ${{ github.sha }}

            Automated write-back from build-image.yml. Promotion to stage/prod is a
            separate, explicitly dispatched decision (see .github/workflows/promote.yml).
          body: |
            Automated dev pin from `build-image.yml`.

            | | |
            |---|---|
            | Tag | `${{ github.sha }}` |
            | Digest | `${{ steps.build.outputs.digest }}` |

            Promote onward with the **promote** workflow (`dev → stage`, then `stage → prod`).

      - name: Job summary
        run: |
          {
            echo "### mcp-backend image pushed"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "A PR pinning the **dev** overlay to this image was opened automatically."
            echo "Promote onward with the \`promote\` workflow (dev → stage → prod)."
          } >> "$GITHUB_STEP_SUMMARY"
