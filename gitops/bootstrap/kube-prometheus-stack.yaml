# kube-prometheus-stack — synced by the root app-of-apps. Sync wave 2.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # Routine drift only (87.16.1 -> 87.21.0, same major). Kept current so the
      # Prometheus Operator CRDs match what our ServiceMonitors/PodMonitors expect.
      targetRevision: 87.21.0
      helm:
        valueFiles:
          - $values/gitops/apps/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/c0debyeric/eks-golden-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
