# loki — synced by the root app-of-apps. Sync wave 2. SingleBinary mode, S3 storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      # Repo RELOCATION, not just a bump: Grafana forked the OSS Loki chart to
      # grafana-community/helm-charts on 2026-03-16 (forked at chart 6.55.0). The old
      # grafana.github.io copy still resolves — so nothing errors — but it is now maintained
      # for Grafana Enterprise Logs only, meaning OSS security/bug fixes silently stop arriving.
      # That makes staying put a no-error failure mode.
      #
      # 6.24.0 -> 18.7.0 is a version-namespace RENUMBER across the fork, NOT 12 majors of
      # breaking upgrades. Verified by rendering this exact chart against our unchanged
      # values.yaml: every key (deploymentMode, singleBinary, gateway, schemaConfig, ...)
      # still resolves.
      targetRevision: 18.7.0
      helm:
        valueFiles:
          - $values/gitops/apps/loki/values.yaml
    - repoURL: https://github.com/c0debyeric/eks-golden-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
