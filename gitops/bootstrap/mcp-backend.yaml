# ApplicationSet: one Argo CD Application per environment for the mcp-backend
# workload, rendered from the Helm chart in charts/mcp-backend.
#
# WHY an ApplicationSet rather than three hand-written Application manifests: the
# three environments differ in exactly four values (namespace, values file, sync
# policy, sync wave). Hand-maintaining three near-identical 40-line manifests is
# how a syncOption on one environment drifts from the others — and a missing
# ServerSideApply or CreateNamespace only surfaces at sync time as an opaque
# "one or more synchronization tasks are not valid".
#
# WHY the LIST generator and not a git-directory generator: a directory generator
# auto-discovers paths and would silently create a full Application for any new
# directory, so an experimental values file committed for local testing would
# self-deploy. The list is explicit: three environments, reviewed, no surprises.
#
# WHY TWO SOURCES rather than putting values-<env>.yaml inside the chart:
# Argo CD refuses `valueFiles` paths that escape the chart directory, so an
# environment file living outside charts/ cannot be referenced from a single
# source. The `ref` mechanism is the supported way to combine "chart from here,
# values from there". Keeping environment config in gitops/ and the chart in
# charts/ means the chart stays a reusable artifact with no environment knowledge
# baked in, and CI patches only the values file.
# Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mcp-backend
  namespace: argocd
spec:
  # goTemplate gives real conditionals instead of the legacy {{param}} string
  # substitution, which cannot express "prod syncs manually".
  goTemplate: true
  goTemplateOptions: ["missingkey=error"] # fail fast on a typo'd key rather than render ""

  generators:
    - list:
        elements:
          # Wave 5: after otel-operator (2) and the gateway collector (4), so the
          # OTLP endpoint exists before pods start, and after external-secrets (1)
          # and its config (2), so the database Secret is materialised before the
          # Deployment references it. Environments roll dev -> stage -> prod.
          - env: dev
            namespace: mcp-dev
            wave: "5"
          - env: stage
            namespace: mcp-stage
            wave: "6"
          - env: prod
            namespace: mcp-prod
            wave: "7"

  template:
    metadata:
      name: mcp-backend-{{.env}}
      annotations:
        argocd.argoproj.io/sync-wave: "{{.wave}}"
      finalizers:
        # Deleting the Application cascades to its workloads instead of orphaning
        # them in the namespace.
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        # The chart. Environment-agnostic; carries no dev/stage/prod knowledge.
        - repoURL: https://github.com/c0debyeric/eks-golden-platform.git
          path: charts/mcp-backend
          targetRevision: main
          helm:
            releaseName: mcp-backend
            valueFiles:
              # $values resolves to the ref'd source below.
              - $values/gitops/apps/mcp-backend/values-{{.env}}.yaml
        # Values-only source. `ref` makes the repo available for valueFiles
        # lookups WITHOUT Argo CD trying to render its contents as manifests —
        # omitting `ref` (or adding a `path`) makes Argo attempt to apply the
        # whole repository.
        - repoURL: https://github.com/c0debyeric/eks-golden-platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true # the mcp-* namespaces are created on first sync
          # ServerSideApply avoids the 262144-byte client-side apply annotation
          # cap. Not strictly required at this manifest size, but kept uniform
          # with the platform apps so a future large config blob does not fail in
          # only one environment.
          - ServerSideApply=true
      ignoreDifferences:
        # The ExternalSecret CRD defaults many optional fields server-side
        # (conversionStrategy, decodingStrategy, metadataPolicy,
        # target.deletionPolicy) that are not in our minimal manifest. Argo CD
        # would otherwise report those injected defaults as perpetual drift and
        # selfHeal would fight the API server forever.
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/data
            - /spec/target
            - /spec/refreshInterval

  # PROMOTION GATE, expressed as a template PATCH rather than an inline conditional.
  #
  # dev and stage get automated sync (prune + selfHeal). prod deliberately gets
  # NO `automated` block: a merged promotion PR changes Git, then a human triggers
  # the sync. Auto-syncing prod would make `git merge` and `deploy to production`
  # the same irreversible action, removing the last checkpoint before customer
  # traffic moves. selfHeal off also means an emergency kubectl mitigation is not
  # reverted out from under the operator mid-incident.
  #
  # templatePatch is applied after the template renders, so this stays valid YAML
  # in Git and is reviewable — unlike a {{- if }} wrapped around a mapping key.
  templatePatch: |
    {{- if ne .env "prod" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
