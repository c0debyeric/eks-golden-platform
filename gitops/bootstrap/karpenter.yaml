# karpenter — the Karpenter controller (Helm chart from the OCI registry). Installs the
# NodePool/EC2NodeClass CRDs + the controller Deployment.
#
# WHY sync-wave "-2": the karpenter-nodepools app (wave 0) applies NodePool/EC2NodeClass
# custom resources — those CRDs don't exist until THIS chart installs them. Without the
# controller, nodepools sync fails with "one or more synchronization tasks are not valid"
# and no new nodes are ever provisioned (pods stay Pending with "Too many pods").
#
# Controller credentials: EKS Pod Identity, associated in Terraform via the karpenter
# sub-module (create_pod_identity_association=true) to the kube-system/karpenter SA.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    # 1.14.0 still serves the stable karpenter.sh/v1 + karpenter.k8s.aws/v1 APIs our
    # NodePool/EC2NodeClass manifests use (verified against the chart's crds/ directory --
    # note Karpenter ships CRDs in crds/, so `helm template` alone does NOT reveal them).
    # Compatible with EKS 1.34.
    targetRevision: 1.14.0
    helm:
      # Render the chart's crds/ directory as ordinary manifests so ArgoCD MANAGES the CRDs.
      #
      # WHY: `helm upgrade` deliberately never touches crds/ -- it installs those files once and
      # never again. ArgoCD's Helm source inherits that behavior, so without this flag the CRDs
      # stay frozen at whatever version FIRST installed them while the controller image tracks
      # targetRevision. On 2026-07-29 that skew broke the cluster outright: the 1.14.0 controller
      # computed NodeClaims using the Gte operator (added in 1.14) against CRDs still shipped by
      # 1.0.8, so the API server rejected EVERY provisioning attempt --
      #   spec.requirements[6].operator: Unsupported value: "Gte"
      # -- and no capacity could be created at all. Pods sat Pending, cert-manager/ESO/ArgoCD were
      # stranded, and the fix had to be applied by hand with kubectl.
      #
      # With this flag the CRDs move in lockstep with the chart pin, so a Renovate bump can no
      # longer desync them. Paired with ServerSideApply=true below, which is REQUIRED: Karpenter's
      # CRDs exceed the 262144-byte last-applied-configuration annotation limit that client-side
      # apply would impose.
      skipCrds: false
      valuesObject:
        settings:
          clusterName: eks-golden
          # Let Karpenter resolve the API endpoint itself.
          #
          # This previously hardcoded the cluster's API endpoint as a literal, and EKS mints
          # a new one for every cluster. `make down` + `make up` therefore
          # left Karpenter pointed at an endpoint that no longer resolves, and the nodes it
          # launched could not reach the API server to join -- so the rebuilt cluster would
          # come up with no workload capacity and no obvious culprit, because Karpenter
          # itself stays Running and Healthy while doing it. Unlike the ALB controller's
          # vpcId, this one carried no warning that it needed hand-editing after a rebuild.
          #
          # eksControlPlane tells Karpenter to discover cluster details -- the endpoint
          # included -- through the EKS DescribeCluster API instead. Verified against the
          # pinned chart 1.14.0, whose values.yaml documents exactly this, and against the
          # live controller role, which already grants eks:DescribeCluster, so this needs no
          # IAM change. clusterEndpoint is now simply absent and resolved at runtime, which
          # is what makes it survive a teardown.
          eksControlPlane: true
          # Derived from the cluster name in Terraform (module.karpenter), so this one IS
          # stable across rebuilds and is safe to state literally.
          interruptionQueue: Karpenter-eks-golden
        serviceAccount:
          # Pod Identity targets this SA name; do NOT add an IRSA role annotation.
          create: true
          name: karpenter
        replicas: 1
        controller:
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
