# external-secrets — synced by the root app-of-apps. Sync wave 1 (CRDs before consumers).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      # 2.8.0 serves ONLY external-secrets.io/v1 — v1beta1 serving was removed on 2026-05-01
      # (the crds.unsafeServeV1Beta1 escape hatch is gone too). The ClusterSecretStore /
      # ExternalSecret manifests in gitops/apps/external-secrets/ were migrated to v1 in the
      # SAME commit as this bump; splitting them would leave ArgoCD reporting
      # "one or more synchronization tasks are not valid" against an unserved apiVersion.
      targetRevision: 2.8.0
      helm:
        valueFiles:
          - $values/gitops/apps/external-secrets/values.yaml
    - repoURL: https://github.com/c0debyeric/eks-golden-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
