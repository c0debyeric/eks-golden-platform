# tempo — synced by the root app-of-apps. Sync wave 2 (peer of loki/kube-prometheus-stack:
# needs the gp3 StorageClass from wave -1 and its Pod Identity association, both of which exist
# well before this). Monolithic mode, S3 trace storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    # Wave 3, moved up from 2: Tempo now ships a ServiceMonitor and its metrics-generator
    # remote-writes into Prometheus, so both the ServiceMonitor CRD and the Prometheus instance
    # (kube-prometheus-stack, wave 2) must already exist.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source: pull the upstream chart, feed it our in-repo values.yaml via the $values ref
  # (identical pattern to loki.yaml so the repo URL isn't duplicated inside the values path).
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      # Same repo relocation as loki.yaml: the OSS chart now lives in
      # grafana-community/helm-charts; the grafana.github.io copy is Enterprise-only
      # maintenance mode and silently stops receiving OSS fixes.
      #
      # 2.2.3 ships Tempo app 2.10.7 (vs app 2.x on the old pinned chart 1.24.4). Verified by
      # rendering this chart against our unchanged values.yaml — tempo.storage.trace.s3,
      # receivers.otlp, persistence and serviceAccount keys all still resolve.
      targetRevision: 2.2.3
      helm:
        valueFiles:
          - $values/gitops/apps/tempo/values.yaml
    - repoURL: https://github.com/c0debyeric/eks-golden-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
