# Environment-agnostic base for mcp-backend.
#
# WHY a base/overlay split at all: dev, stage and prod are three NAMESPACES on the one
# eks-golden cluster, so the same three manifests get applied three times with only a
# handful of fields differing (namespace, replica count, image tag, OTel env label).
# Copying the manifests per env would guarantee drift — a security-context or probe fix
# would have to be made in triplicate and would silently be forgotten in one of them.
# Kustomize keeps exactly one copy of the shared 95% and confines env deltas to a patch.
#
# WHY kustomize and not Helm here: mcp-backend is plain manifests, not a chart. Wrapping
# it in a chart purely to gain values templating adds a rendering layer and a chart
# version to maintain for one workload. ArgoCD renders kustomize natively (no plugin,
# no configManagementPlugin), and kubectl already ships kustomize v5.5.0 so the same
# `kubectl kustomize` output can be diffed locally and in CI.
#
# WHY no `namespace:` here: the overlays set it. The base is deliberately not applyable
# on its own — that is the point. If someone adds `namespace:` back, all three envs
# collapse into one and prod gets overwritten by dev's next sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# Common identity labels. app.kubernetes.io/part-of is what ties every object back to
# the platform in Grafana/kubectl queries; the per-env instance label is added by the
# overlays so dashboards can split by environment without renaming the workload.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: eks-golden-platform

# Single source of truth for the container image across all three envs.
#
# WHY newTag is intentionally a placeholder and NOT a real tag: the promotion pipeline
# rewrites this field per overlay, never here. A concrete tag in the base would be the
# value every env silently inherits when an overlay patch is mistyped — which is exactly
# how the current REPLACE_WITH_GIT_SHA placeholder ended up live and Degraded.
images:
  - name: PLACEHOLDER_IMAGE
    newName: PLACEHOLDER_IMAGE
