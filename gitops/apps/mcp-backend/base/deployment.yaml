# mcp-backend — OpenTelemetry-instrumented MCP server (source: application/backend).
# Stateless Streamable HTTP: any replica serves any request, so it scales with no
# session affinity. Telemetry is PUSHED via the explicit OTel SDK to the gateway
# collector (not the zero-code Instrumentation CRD), so no inject-* annotation and
# no ServiceMonitor are needed — metrics/traces reach Prometheus/Tempo through the
# OTLP pipeline, logs reach Loki via container stdout (node DaemonSet collector).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-backend
  labels:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: eks-golden-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: eks-golden-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000              # the 'node' user baked into the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-backend
          # Image name is a KUSTOMIZE TARGET, not a real reference. Each overlay's
          # `images:` block rewrites this to the ECR repo + the digest being promoted.
          # WHY a sentinel instead of a plausible-looking default: a real-looking tag here
          # would be silently inherited by any env whose overlay patch is wrong, which is
          # how the previous REPLACE_WITH_GIT_SHA value reached the cluster and stuck the
          # Deployment in InvalidImageName. A sentinel fails loudly and unmistakably.
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: mcp-backend
            # Gateway collector OTLP/HTTP endpoint (observability namespace).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://gateway-collector.observability.svc:4318
            # Overridden per environment by the overlay patch. WHY it must be: this value
            # is what splits traces/metrics by env in Grafana and Tempo. Left at a
            # hardcoded "prod" (as it was before the base/overlay split), dev and stage
            # telemetry would be indistinguishable from production data.
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: OVERRIDDEN_BY_OVERLAY
            # Downward-API pod identity, folded into OTel resource attributes so
            # spans/metrics carry k8s.* for Grafana correlation.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # service.namespace / k8s.namespace.name are patched per overlay to the real
            # env namespace. $(POD_NAME) is expanded by the kubelet from the env var above,
            # NOT by kustomize — it must stay single-quoted-safe and literal here.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=OVERRIDDEN_BY_OVERLAY,k8s.namespace.name=OVERRIDDEN_BY_OVERLAY,k8s.pod.name=$(POD_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem is on, so give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
      # Spread replicas across zones/nodes for AZ-fault tolerance (best-effort).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-backend
