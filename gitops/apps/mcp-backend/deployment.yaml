# mcp-backend — OpenTelemetry-instrumented MCP server (source: application/backend).
# Stateless Streamable HTTP: any replica serves any request, so it scales with no
# session affinity. Telemetry is PUSHED via the explicit OTel SDK to the gateway
# collector (not the zero-code Instrumentation CRD), so no inject-* annotation and
# no ServiceMonitor are needed — metrics/traces reach Prometheus/Tempo through the
# OTLP pipeline, logs reach Loki via container stdout (node DaemonSet collector).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-backend
  namespace: application
  labels:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: eks-golden-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: eks-golden-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000              # the 'node' user baked into the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-backend
          # Built & pushed by .github/workflows/build-image.yml (tag = 12-char git SHA).
          # Replace <account> and the tag with the values the workflow prints in its
          # job summary (or pin by @sha256 digest for full immutability).
          image: <account>.dkr.ecr.us-east-1.amazonaws.com/mcp-backend:REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: mcp-backend
            # Gateway collector OTLP/HTTP endpoint (observability namespace).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://gateway-collector.observability.svc:4318
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: prod
            # Downward-API pod identity, folded into OTel resource attributes so
            # spans/metrics carry k8s.* for Grafana correlation.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=application,k8s.namespace.name=application,k8s.pod.name=$(POD_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem is on, so give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
      # Spread replicas across zones/nodes for AZ-fault tolerance (best-effort).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-backend
