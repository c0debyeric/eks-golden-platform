# stage overlay — namespace mcp-stage on the shared eks-golden cluster.
#
# Stage exists to be a production REHEARSAL, so it keeps the base's 2 replicas, the PDB
# and the topology spread. WHY that matters: a single-replica stage cannot catch the two
# failure classes that only appear with >1 pod — rolling-update readiness gaps and PDB /
# drain deadlocks. Those are precisely the defects you want to find before prod.
#
# The only intentional difference from prod is resource headroom and the promotion gate:
# stage auto-syncs, prod does not.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-stage
resources:
  - ../../base
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: mcp-backend-stage
      environment: stage
# Rewritten by the promotion workflow when a dev digest is promoted to stage.
images:
  - name: PLACEHOLDER_IMAGE
    newName: 810749429738.dkr.ecr.us-east-1.amazonaws.com/mcp-backend
    newTag: a7b96ed603df
    digest: sha256:feeeae5e3c0764a2d79f34bbac1150c568a0f0e93c102f01d341b2631bd75761
replicas:
  - name: mcp-backend
    count: 2
patches:
  # Env-specific telemetry identity — keyed by env NAME, not list index, so a reorder in
  # the base cannot silently retarget the wrong variable.
  - target:
      kind: Deployment
      name: mcp-backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-backend
      spec:
        template:
          spec:
            containers:
              - name: mcp-backend
                env:
                  - name: OTEL_DEPLOYMENT_ENVIRONMENT
                    value: stage
                  - name: OTEL_RESOURCE_ATTRIBUTES
                    value: "service.namespace=mcp-stage,k8s.namespace.name=mcp-stage,k8s.pod.name=$(POD_NAME)"
