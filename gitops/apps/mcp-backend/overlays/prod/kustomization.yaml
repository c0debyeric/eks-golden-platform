# prod overlay — namespace mcp-prod on the shared eks-golden cluster.
#
# Prod differs from stage in three deliberate ways:
#   1. 3 replicas, so one AZ loss still leaves 2 serving (topologySpread is best-effort
#      via ScheduleAnyway, so replicas must carry the real redundancy).
#   2. minAvailable raised to 2 — with 3 replicas, minAvailable:1 would permit draining
#      two pods at once and collapse capacity to a single pod during consolidation.
#   3. Higher memory limit: same image, but prod carries real traffic and the base's
#      192Mi ceiling is sized for an idle dev pod.
#
# Prod's Application does NOT auto-sync (see gitops/bootstrap/mcp-backend-prod.yaml) —
# the promotion PR merge is the human gate, and ArgoCD then applies on manual sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-prod

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: mcp-backend-prod
      environment: prod

# Rewritten by the promotion workflow when a stage digest is promoted to prod.
images:
  - name: PLACEHOLDER_IMAGE
    newName: 810749429738.dkr.ecr.us-east-1.amazonaws.com/mcp-backend
    newTag: prod-bootstrap

replicas:
  - name: mcp-backend
    count: 3

patches:
  # See header item 2: 3 replicas need minAvailable 2, not the base's 1.
  - target:
      kind: PodDisruptionBudget
      name: mcp-backend
    patch: |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: mcp-backend
      spec:
        minAvailable: 2

  - target:
      kind: Deployment
      name: mcp-backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-backend
      spec:
        template:
          spec:
            containers:
              - name: mcp-backend
                env:
                  - name: OTEL_DEPLOYMENT_ENVIRONMENT
                    value: prod
                  - name: OTEL_RESOURCE_ATTRIBUTES
                    value: "service.namespace=mcp-prod,k8s.namespace.name=mcp-prod,k8s.pod.name=$(POD_NAME)"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 384Mi
