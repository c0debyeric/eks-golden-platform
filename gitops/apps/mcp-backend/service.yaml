# ClusterIP service in front of the mcp-backend pods. Internal only — an
# unauthenticated MCP server should NOT be exposed publicly. To expose it,
# front it with auth (MCP spec: OAuth 2.1) + an Ingress on the ALB controller.
apiVersion: v1
kind: Service
metadata:
  name: mcp-backend
  namespace: application
  labels:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/part-of: eks-golden-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-backend
  ports:
    - name: http
      port: 80
      targetPort: http
