# prod overlay for mcp-backend (namespace mcp-prod).
#
# Prod differs from stage in three deliberate ways:
#   1. 3 replicas, so losing one AZ still leaves 2 serving. topologySpread is
#      best-effort (ScheduleAnyway), so the replicas must carry the real
#      redundancy.
#   2. minAvailable 2 — with 3 replicas, minAvailable:1 would permit draining two
#      pods at once and collapse capacity to a single pod during consolidation.
#   3. Higher memory limit: same image, but prod carries real traffic and the
#      chart default's 192Mi ceiling is sized for an idle dev pod.
#
# Prod's Argo CD Application has NO `automated` syncPolicy: merging a promotion
# PR changes desired state, and a human then triggers the sync.
environment: prod

replicaCount: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 384Mi

# Rewritten by the promote workflow on a stage -> prod promotion.
#
# NOTE: this previously read `prod-bootstrap`, a tag that was never pushed to
# ECR, which is why mcp-backend-prod could only ever sync into ImagePullBackOff.
# Pinned here to the same digest stage validated. Prod still does not auto-sync,
# so this changes desired state only.
image:
  tag: f952f79c3819
  digest: sha256:d26a674f76003048012a801a1d1414c5e964b8854aec814fd0ca673c245ff5e6
