# stage environment for mcp-frontend (namespace mcp-stage).
#
# Production rehearsal: 2 replicas and the PDB retained, so rolling-update
# readiness gaps and drain deadlocks surface here rather than in prod.
#
# Stage has its OWN ALB group, so exposing it cannot collide with dev or prod on
# a shared listener. Still plain HTTP with no host rule — fine for a rehearsal
# environment holding no real data.
environment: stage

replicaCount: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  groupName: eks-golden-stage

backend:
  url: http://mcp-backend.mcp-stage.svc.cluster.local

