# prod environment for mcp-frontend (namespace mcp-prod).
#
# 3 replicas so losing one AZ still leaves 2 serving, and minAvailable 2 so
# consolidation cannot drain down to a single pod. Higher memory ceiling than the
# chart default, which is sized for an idle dev pod.
#
# Prod has its OWN ALB group, so exposing it cannot collide with dev or stage.
#
# RESIDUAL RISK, stated plainly: this listener is internet-facing, plain HTTP,
# and the API behind it has no user authentication — every visitor acts as the
# single hardcoded owner `demo`. That is acceptable ONLY because this is a
# demonstration platform holding no real data. Before this carries anything
# real: terminate TLS with an ACM cert, put `alb.ingress.kubernetes.io/
# auth-type: oidc` on the listener, and replace APP_OWNER with the verified
# identity the ALB injects. All three need a domain, which is the actual
# blocker — not effort.
environment: prod

replicaCount: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  groupName: eks-golden-prod

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi

backend:
  url: http://mcp-backend.mcp-prod.svc.cluster.local

