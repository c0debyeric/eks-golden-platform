# Tempo values — monolithic (single-binary) mode, S3-backed traces.
# Cheapest mode for a portfolio cluster and the trace analog of Loki's SingleBinary: one Tempo
# process, minimal footprint. S3 storage means traces survive `make down`/`make up`, and auth to
# S3 is via Pod Identity (the tempo SA is associated with an IAM role in terraform/iam.tf) — NO
# static keys. See docs/research/03-observability.md §6.

tempo:
  # 72h block retention — traces are high-volume/low-value-over-time; keep them shorter than the
  # 7d log/metric retention to hold down S3 cost. Bump if you need longer trace lookback.
  retention: 72h

  # Object storage backend. The AWS SDK inside Tempo resolves credentials from the Pod Identity
  # association (terraform/iam.tf) — no access_key/secret_key here, nothing sensitive in Git.
  storage:
    trace:
      backend: s3
      s3:
        bucket: eks-golden-tempo-traces
        endpoint: s3.us-east-1.amazonaws.com   # regional endpoint; region derived from it
      # WAL stays on the pod's local disk (a gp3 PVC below); only flushed blocks go to S3.
      wal:
        path: /var/tempo/wal

  # Only the OTLP receivers are needed — the OTel Collector gateway ships traces here over OTLP
  # (gitops/apps/otel-collector/collector.yaml). Drop the chart's default Jaeger/OpenCensus/Zipkin
  # receivers to shrink the attack surface and config.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # Turns traces into metrics. This is what produces the RED series behind Grafana's
  # `tracesToMetrics` link and the service map / node graph on the Tempo datasource
  # (gitops/apps/kube-prometheus-stack/values.yaml). Without it those panels are permanently
  # empty and every span is a dead end — you can read one request but never aggregate them.
  #
  # The generator writes to Prometheus over remote-write, so it depends on
  # prometheus.prometheusSpec.enableRemoteWriteReceiver being on. If that flag ever goes back to
  # false this silently 404s and the service map goes blank.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-operated.monitoring.svc:9090/api/v1/write
    registry:
      collection_interval: 15s
      external_labels:
        source: tempo
    processor:
      service_graphs:
        wait: 10s
      span_metrics:
        # target_info carries the service's resource attributes as a companion series so panels
        # can join on env/namespace instead of guessing from the service name.
        enable_target_info: true
    storage:
      # Chart default is /tmp/tempo, which is a container-lifetime scratch dir. Point it at the
      # gp3 PVC mounted at /var/tempo so an un-flushed WAL survives a pod restart.
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    # Raised from 512Mi: the metrics-generator keeps an in-memory registry of active series and
    # a traces WAL, both of which are additive to the ingester's footprint.
    limits: { memory: 1Gi }

  # Anonymous usage reporting off for a private portfolio cluster.
  reportingEnabled: false

  # Per-tenant switch that actually ARMS the generator. metricsGenerator.enabled above only
  # deploys and configures the component; without these processors listed for the default tenant
  # it starts up healthy and produces nothing. Two settings, one feature — easy to half-enable.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

# ServiceAccount that Tempo's S3 access binds to. Pod Identity targets this exact
# namespace/name pair (tracing/tempo) — must match aws_eks_pod_identity_association.tempo.
serviceAccount:
  create: true
  name: tempo

# WAL needs durable local scratch between restarts; back it with the default gp3 StorageClass
# (same as Loki/Prometheus) so the pod reschedules without losing un-flushed traces.
persistence:
  enabled: true
  storageClassName: gp3
  size: 10Gi

# Single replica — monolithic mode for a lean portfolio stack.
replicas: 1

# Scrape Tempo's own metrics (ingest rate, generator health, S3 flush errors). Selected only
# because kube-prometheus-stack sets serviceMonitorSelectorNilUsesHelmValues: false — Tempo runs
# in the `tracing` namespace and cannot carry that chart's release label.
serviceMonitor:
  enabled: true
