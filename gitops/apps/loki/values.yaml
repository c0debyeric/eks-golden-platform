# Loki values — SingleBinary (monolithic) mode, S3-backed. Cheapest mode for a portfolio cluster;
# S3 storage means logs survive `make down`/`make up`. Auth to S3 via IRSA/Pod Identity (no keys).
deploymentMode: SingleBinary

loki:
  auth_enabled: false          # single-tenant portfolio cluster
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: eks-golden-loki-chunks
      ruler: eks-golden-loki-ruler
    s3:
      region: us-east-1        # credentials via serviceAccount role, not static keys
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h     # 7 days
    # Required for OTLP ingestion: everything on an OTLP LogRecord that is not the body or the
    # timestamp — including trace_id/span_id — lands in structured metadata. With this off Loki
    # rejects the whole payload as malformed. It defaults to true in Loki 3.x; pinned explicitly
    # because the trace_id -> Tempo link in Grafana depends on it and a silent default flip would
    # break correlation without breaking ingestion.
    allow_structured_metadata: true
    otlp_config:
      resource_attributes:
        # Loki indexes ~17 resource attributes as labels by default, two of which are unbounded:
        # k8s.pod.name churns on every rollout and service.instance.id is per-process. Grafana's
        # own guidance is to demote them to structured metadata — still queryable, but no longer
        # multiplying the stream count (and the index) on every deploy.
        attributes_config:
          - action: structured_metadata
            attributes:
              - k8s.pod.name
              - service.instance.id

  # Retention is a TWO-part setting and this is the half everyone forgets. limits_config
  # .retention_period only makes old data invisible to queries; the compactor is what actually
  # deletes chunks from S3. Without retention_enabled the bucket grows forever while the UI
  # dutifully reports a 7-day window — a bill that arrives months later with no warning signal.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: s3

  # Loki 3.x native OTLP endpoint (/otlp/v1/logs) is enabled by default; both the gateway
  # collector (app OTLP logs) and the logs DaemonSet (container stdout) ship here via the
  # otlphttp exporter (see gitops/apps/otel-collector/).

# ServiceAccount that Loki S3 access binds to (annotate with IRSA role ARN, or use Pod Identity
# association targeting this SA — see docs/research/01 §3 and 03 §3).
serviceAccount:
  create: true
  name: loki

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# Disable the microservices-mode components (we're monolithic).
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
gateway:
  enabled: true                # nginx gateway; Grafana + OTel target loki-gateway
  replicas: 1

# The bundled test/canary and self-monitoring add cost; off for a lean portfolio stack.
test: { enabled: false }
lokiCanary: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }

# Loki's own health signals. Both are free (no extra pods) and both were previously missing,
# which meant the log pipeline was the one component in the stack with no way to answer "is it
# actually ingesting?". The ServiceMonitor is only selected because kube-prometheus-stack sets
# serviceMonitorSelectorNilUsesHelmValues: false — Loki lives in a different namespace and
# cannot carry that chart's release label.
monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true            # ships Loki's maintained dashboards as grafana_dashboard=1 ConfigMaps
    namespace: monitoring    # where the Grafana sidecar and the rest of the dashboards live
