# Karpenter EC2NodeClass — how nodes are launched. Discovers subnets/SGs by the
# karpenter.sh/discovery=<cluster> tag applied in Terraform (main.tf).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023                # current default AMI family
  amiSelectorTerms:
    - alias: al2023@latest
  role: eks-golden-karpenter       # stable node role name pinned in module.karpenter (main.tf)
  # DO NOT set kubelet.maxPods here without first confirming the VPC CNI can actually back it.
  # Tried exactly that (maxPods: 44) on 2026-08-02 and caused an outage: Karpenter launched a
  # node advertising 44 pod slots, the scheduler filled them, and the CNI -- still in ENI-limited
  # mode, because the prefix-delegation change had NOT actually applied -- could only supply 8 IPs.
  # Every pod past the 8th sat in ContainerCreating with
  #   "failed to assign an IP address to container",
  # which took down ArgoCD and cert-manager since they had been rescheduled onto that node.
  #
  # kubelet.maxPods is a PROMISE about capacity. If the CNI cannot honour it the scheduler
  # overcommits the node and the pods that lose are invisible until you read kubelet events.
  # Correct order if raising density: enable prefix delegation, VERIFY ENABLE_PREFIX_DELEGATION
  # is true on the live aws-node DaemonSet, recycle nodes, and only then raise maxPods.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-golden
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-golden
  metadataOptions:
    httpTokens: required           # IMDSv2 enforced
    httpPutResponseHopLimit: 1     # pods can't reach IMDS to steal the node role
